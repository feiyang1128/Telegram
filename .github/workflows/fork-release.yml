name: Build fork release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fork-release.yml'
      - 'automation/**'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Official branch, tag or commit to build
        default: master
        required: true
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation-repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official source and identify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/DrKLO/Telegram.git
          git -C source fetch origin "$UPSTREAM_REF"
          git -C source checkout --detach FETCH_HEAD
          python - <<'PY'
          import os, re
          from pathlib import Path
          props = Path('source/gradle.properties').read_text()
          upstream = int(re.search(r'^APP_VERSION_CODE=(\d+)$', props, re.M)[1])
          name = re.search(r'^APP_VERSION_NAME=(.+)$', props, re.M)[1].strip()
          # Reserve two digits for fork revisions, retaining afat's final digit.
          revision = int(Path('automation-repo/automation/revision.txt').read_text().strip())
          if not 0 <= revision <= 99:
              raise ValueError('Fork revision must be between 0 and 99')
          base = upstream * 100 + revision
          code = base * 10 + 9
          if code > 2100000000:
              raise ValueError('Version code exceeds Android limit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'base={base}\ncode={code}\nname={name}\ntag=fork-{code}\n')
          PY
      - name: Skip versions already published
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Distinguish a missing release from authentication/network failures.
          status=$(curl --silent --show-error --output release.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Release lookup failed: HTTP $status"; exit 1 ;;
          esac
      - name: Validate required configuration
        if: steps.existing.outputs.exists == 'false'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          keys = ['TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'SIGNING_KEYSTORE_BASE64',
                  'SIGNING_KEY_ALIAS', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEY_PASSWORD']
          missing = [key for key in keys if not os.environ.get(key)]
          if missing: raise SystemExit('Configure GitHub Secrets: ' + ', '.join(missing))
          PY
      - name: Apply customizations and initialize submodules
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git -C source apply --3way --index ../automation-repo/automation/patches/customizations.patch
          git -C source diff --cached --check
          cp automation-repo/automation/ForkUpdater.java source/TMessagesProj/src/main/java/org/telegram/messenger/ForkUpdater.java
          git -C source submodule update --init --recursive --depth=1 --jobs=4
          mkdir -p dist
          # Record reproducible public inputs before injecting any secrets.
          git -C source rev-parse HEAD > dist/upstream-commit.txt
          git -C source submodule status --recursive > dist/submodules.txt
          cp automation-repo/automation/patches/customizations.patch dist/customizations.patch
          cp automation-repo/automation/ForkUpdater.java dist/ForkUpdater.java
          cp automation-repo/automation/prepare_build.py dist/prepare_build.py
          cp automation-repo/automation/revision.txt dist/revision.txt
          git -C automation-repo rev-parse HEAD > dist/automation-commit.txt
      - uses: actions/setup-java@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Gradle dependencies
        if: steps.existing.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          # Only downloaded dependencies and distributions; no compiled classes,
          # project outputs, configuration caches, or injected signing material.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-jdk17-v1-${{ hashFiles('source/**/*.gradle*', 'source/gradle/wrapper/gradle-wrapper.properties', 'source/**/libs.versions.toml', 'source/buildSrc/**/*.kt') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-jdk17-v1-
      - uses: android-actions/setup-android@v3
        if: steps.existing.outputs.exists == 'false'
        with:
          packages: platform-tools
      - name: Install native compiler cache
        if: steps.existing.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ccache
          ccache --version
      - name: Restore native compiler cache
        id: native-cache
        if: steps.existing.outputs.exists == 'false'
        uses: actions/cache/restore@v4
        with:
          # ccache checks sources, headers, flags and compiler content itself.
          # Keep each successful build's additions under a new immutable key.
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-cmake3.22.1-arm64-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-ccache-${{ runner.os }}-${{ runner.arch }}-ndk27.2.12479018-cmake3.22.1-arm64-v1-
      - name: Initialize native compiler cache statistics
        if: steps.existing.outputs.exists == 'false'
        run: ccache --zero-stats
      - name: Install Android toolchain
        if: steps.existing.outputs.exists == 'false'
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Inject private build configuration
        if: steps.existing.outputs.exists == 'false'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
          APP_PACKAGE: ${{ vars.APP_PACKAGE || 'io.github.feiyang.messenger' }}
          ENABLE_PASSKEYS: ${{ vars.ENABLE_PASSKEYS || 'false' }}
        run: python automation-repo/automation/prepare_build.py source
      - name: Compile signed arm64 APK
        if: steps.existing.outputs.exists == 'false'
        working-directory: source
        env:
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          BASE_CODE: ${{ steps.version.outputs.base }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          bash gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -PAPP_VERSION_CODE="$BASE_CODE" -PAPP_VERSION_NAME="$VERSION_NAME" \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' --max-workers=2 --no-daemon
      - name: Verify native compiler cache integration
        if: success() && steps.existing.outputs.exists == 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          # CMake puts compiler commands in CMakeFiles/rules.ninja;
          # build.ninja normally only includes that file.
          builds = list(Path('source').rglob('*.ninja'))
          matches = [path for path in builds if 'ccache' in path.read_text()]
          if not matches:
              raise SystemExit('CMake did not configure ccache in any Ninja build')
          for path in matches:
              print(path)
          print('Verified ccache in generated Ninja compiler commands')
          PY
      - name: Show native compiler cache statistics
        if: always() && steps.existing.outputs.exists == 'false' && steps.native-cache.outcome == 'success'
        run: ccache --show-stats
      - name: Save native compiler cache
        if: success() && steps.existing.outputs.exists == 'false'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify APK and publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find source/TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "${apks[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}" > apk-info.txt
          grep -F "versionCode='$CODE'" apk-info.txt
          cp "${apks[0]}" "dist/fork-$CODE-arm64.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          printf 'Upstream: %s\nAutomation: %s\n\nArm64 only. Download and install to update; Android verifies the signing identity.\nSource: official commit + attached patch and updater; CI configuration is in this repository.\n' \
            "$(cat dist/upstream-commit.txt)" "$(cat dist/automation-commit.txt)" > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION_NAME" --notes-file notes.md
      - name: Remove injected credentials
        if: always()
        run: |
          if test -d source/.git; then
            git -C source restore --worktree -- TMessagesProj/config/release.keystore \
              TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java \
              TMessagesProj_AppStandalone/google-services.json gradle.properties
          fi
